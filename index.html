<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Fiesta · en qué va el dinero</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="wrap">
  <h1>Fiesta · en qué va el dinero</h1>
  <p class="sub" id="cabecera">Cargando…</p>

  <div class="cards" id="cards"></div>

  <section>
    <h2>Cómo va la recaudación</h2>
    <div class="bar"><i id="barra" style="width:0%"></i></div>
    <p class="sub" id="pctTxt"></p>
  </section>

  <section>
    <h2>En qué se gasta</h2>
    <div class="tblwrap"><table id="tPresu"></table></div>
  </section>

  <section>
    <h2>Quién ha puesto qué</h2>
    <div class="tblwrap"><table id="tPersonas"></table></div>
  </section>

  <section>
    <h2>Pagos ya hechos</h2>
    <div class="tblwrap"><table id="tGastos"></table></div>
  </section>

  <section>
    <h2>Movimientos del bote</h2>
    <div class="tblwrap"><table id="tAport"></table></div>
  </section>

  <p class="foot">Página de consulta · se actualiza sola cuando se apunta algo nuevo.</p>
</div>

<script src="motor.js"></script>
<script>
async function pintar(){
  let S;
  try { S = await cargarDatos(); }
  catch(e){ document.getElementById('cabecera').textContent = 'No se pudieron cargar los datos. Prueba a recargar.'; return; }

  const c = calc(S);
  document.getElementById('cabecera').textContent =
    'Solo para consultar · actualizado el ' + fechaLegible(S.actualizado);
  document.getElementById('cards').innerHTML = tarjetas(c);
  document.getElementById('barra').style.width = c.pct + '%';
  document.getElementById('pctTxt').textContent =
    c.pct + '% del bote completo (' + eur(c.objetivo) + ').';

  document.getElementById('tPresu').innerHTML =
    `<thead><tr><th>Concepto</th><th class="num">Importe</th><th>Estado</th></tr></thead><tbody>` +
    S.presupuesto.map(p => `<tr><td>${esc(p.concepto)}</td><td class="num">${eur(p.importe)}</td><td>${estadoConcepto(S, p.concepto, p.importe)}</td></tr>`).join('') +
    `<tr><td style="font-weight:650">Total</td><td class="num" style="font-weight:650">${eur(c.totalPresu)}</td><td></td></tr></tbody>`;

  document.getElementById('tPersonas').innerHTML =
    `<thead><tr><th>Persona</th><th class="num">Ha puesto</th><th class="num">Estado</th></tr></thead><tbody>` +
    c.porPersona.map(p => `<tr><td>${esc(p.nombre)}</td><td class="num">${eur(p.total)}${p.adelantado ? ` <span class="tag">${eur(p.adelantado)} adelantados</span>` : ''}</td><td class="num">${pill(p.saldo)}</td></tr>`).join('') +
    `</tbody>`;

  document.getElementById('tGastos').innerHTML =
    `<thead><tr><th>Concepto</th><th class="num">Importe</th><th>Pagado por</th><th>Fecha</th></tr></thead><tbody>` +
    (S.gastos.length ? [...S.gastos].reverse().map(g =>
      `<tr><td>${esc(g.concepto)}</td><td class="num">${eur(g.importe)}</td><td>${g.pagador==='bote' ? '<span class="tag">bote</span>' : esc(nombreDe(S,g.pagador)) + ' <span class="tag">adelanto</span>'}</td><td class="fecha">${esc(g.fecha||'')}</td></tr>`
    ).join('') : `<tr><td colspan="4" class="empty">Todavía no se ha pagado nada.</td></tr>`) + `</tbody>`;

  document.getElementById('tAport').innerHTML =
    `<thead><tr><th>Persona</th><th class="num">Importe</th><th>Nota</th><th>Fecha</th></tr></thead><tbody>` +
    (S.aportaciones.length ? [...S.aportaciones].reverse().map(a =>
      `<tr><td>${esc(nombreDe(S,a.personaId))}</td><td class="num" style="color:${a.importe<0?'var(--warn)':'inherit'}">${eur(a.importe)}</td><td class="fecha">${esc(a.nota||'')}</td><td class="fecha">${esc(a.fecha||'')}</td></tr>`
    ).join('') : `<tr><td colspan="4" class="empty">Todavía no ha puesto nadie.</td></tr>`) + `</tbody>`;
}

pintar();
setInterval(pintar, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pintar(); });
</script>
</body>
</html>
